  <body>
    <script>
      // 1.Create a method to check if a number is odd or even.
      // 2.Create a method to return larger of the two numbers.
      // 3.Create Method to convert Celsius to Fahrenheit. F = (9/5) * C + 32

      function evenOrOdd(number) {
        if (number % 2 == 0) {
          console.log("Even number");
        } else {
          console.log("Odd number");
        }
      }

      function largerNumber(firstNumber, secondNumber) {
        if (firstNumber > secondNumber) {
          return firstNumber;
        } else {
          return secondNumber;
        }
      }

      function toFahrenheit(celsiusValue) {
        return (9 / 5) * celsiusValue + 32;
      }
      console.log(toFahrenheit(38));
      console.log(toFahrenheit(0));
      console.log(toFahrenheit(100));
    </script>
