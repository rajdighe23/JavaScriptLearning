<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Myntra</title>
  </head>
  <body>
    <button
      class="bag-button"
      onclick="cartQuantity++;
    document.querySelector('#card-summary').innerHTML = `Your bag has ${cartQuantity} items`;
    "
    >
      Add to Bag
    </button>
    <button
      class="wish-button"
      onclick="cartQuantity-=1;
    document.querySelector('#card-summary').innerHTML = `Your bag has ${cartQuantity} items`;"
    >
      MOVE TO WISHLIST
    </button>

    <button
      class="bag-button"
      onclick="cartQuantity+=2;
    document.querySelector('#card-summary').innerHTML = `Your bag has ${cartQuantity} items`"
    >
      Add 1+1 Sale Item
    </button>
    <h1 id="card-summary"></h1>
    <script src="./app.js"></script>
  </body>
</html>
